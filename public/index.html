<!doctype html>
<html lang='en'>
  
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale-1">
    <meta
      name="description"
      content="The Watchlist Maker lets users create a personal watchlist for films and shows"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='js/main.js' defer></script>
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>

  <body class="bg-dark text-light">

    <header class="container text-center py-5">
      <h1 class="display-4"> Watchlist Maker </h1>
      <p class="lead"> Add a movie or show and its streaming platform to your watchlist </p>
      <button id="logout-button" class="btn btn-outline-light"> Log Out </button>
    </header>

    <main class="container pb-5">

      <section id="add-title" class="mb-5">
        <div class="card bg-dark text-light border-light shadow">
          <div class="card-body">
            <h2 class="card-title mb-4"> Add to watchlist </h2>

            <form id="watchlist-form">

              <div class="mb-3">
                <label for="title" class="form-label"> Title </label>
                <input type="text" id="title" name="title" class="form-control" required>

              </div>

              <div class="mb-3">
                <label for="type" class="form-label"> Film or Show</label>
                <select id="type" name="type" class="form-select" required>
                  <option value=""> Film or Show? </option>
                  <option value="Film"> Film </option>
                  <option value="Show"> Show </option>
                </select>
              </div>

              <div class="mb-3">
                <label for="platform" class="form-label"> Streaming Platform </label>
                <select id="platform" name="platform" class="form-select" required>
                  <option value=""> What streaming platform? </option>
                  <option value="HBOMax"> HBOMax </option>
                  <option value="Netflix"> Netflix </option>
                  <option value="Hulu"> Hulu </option>
                  <option value="Disney+"> Disney+ </option>
                  <option value="Prime"> Prime </option>
                  <option value="Peacock"> Peacock </option>
                  <option value="Paramount+"> Paramount+ </option>
                  <option value="AppleTV"> AppleTV </option>
                  <option value="YouTube"> YouTube </option>
                  <option value="Other"> Other </option>

                </select>
              </div>

              <button type="submit"> Submit </button>

          
            </form>
          </div>
        </div>
        
      </section>

      <section id="results">
        <h2 class="mb-4"> Results </h2>

        <div class="table-responsive">
          <table id="watchlist" class="table table-dark table-striped table-hover align-middle">
            <thead>
              <tr>
                <th> Title </th>
                <th> Type </th>
                <th> Platform </th>
                <th> Date Added </th>
                <th> Edit </th>
              </tr>
            </thead>

            <tbody id="watchlist-body">
            </tbody>
          </table>
        </div>
        
      </section>
    </main>
  </body>

</html>
