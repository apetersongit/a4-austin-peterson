<!doctype html>
<html lang="en">
    <head>
        <title>Watchlist Maker Login</title>
        <meta charset=""utf-8 />
        <meta name="viewport" content="width=device-width, initial-scale-1">
        <meta
            name="description"
            content="The Watchlist Maker lets users create a personal watchlist for films and shows"/>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="js/login.js" defer></script>
        <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    </head>

    <body class="bg-dark text-light">
        <header class="container text-center py-5">
            <h1 class="display-4">Watchlist Maker</h1>
            <p class="lead">Log in with Username and Password</p>
        </header>

        <main class="container">
            <section class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card bg-dark text-light border-light shadow">
                        <div class="card-body">
                            <h2 class="card-title text-center mb-4"> Login </h2>

                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="username" class="form-label"> Username </label>
                                    <input type="text" id="username" name="username" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label"> Password </label>
                                    <input type="password" id="password" name="password" class="form-control" required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100"> Log In </button>
                            </form>
                            <p id="login-message" class="mt-3 text-center text-light"></p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
